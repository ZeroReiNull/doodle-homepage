name: Build single-file homepage

on:
  push:
    paths-ignore:
      - "dist/index.html"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single HTML file
        run: npm run build

      - name: Commit generated file to the branch
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add --force dist/index.html
          if git diff --cached --quiet; then
            echo "dist/index.html is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update single-file build"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodle-homepage-single-file
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Publish compiled homepage to main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'dev'
        env:
          PRODUCTION_WORKTREE: ${{ runner.temp }}/doodle-homepage-production
        run: |
          git fetch origin main
          git worktree add "${PRODUCTION_WORKTREE}" origin/main
          cp dist/index.html "${PRODUCTION_WORKTREE}/index.html"
          cd "${PRODUCTION_WORKTREE}"
          git add index.html
          if git diff --cached --quiet; then
            echo "main/index.html is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Deploy production homepage"
            git push origin HEAD:main
          fi
