name: Build single-file homepage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build single HTML file
        run: npm run build

      - name: Upload single-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodle-homepage-single-file
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30
